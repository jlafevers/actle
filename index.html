<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACTLE</title>
<meta name="description" content="A daily ACT practice puzzle — one question each from Math, English, Reading, and Science. 60 seconds per question, one attempt a day.">
<meta property="og:title" content="ACTLE — a daily ACT practice puzzle">
<meta property="og:description" content="4 questions. 60 seconds each. One shot a day.">
<meta property="og:image" content="https://actle.org/og-image.png">
<meta property="og:url" content="https://actle.org">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ACTLE — a daily ACT practice puzzle">
<meta name="twitter:description" content="4 questions. 60 seconds each. One shot a day.">
<meta name="twitter:image" content="https://actle.org/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* layout: one centered scorecard-style panel; a scantron bubble row per question; a paper-stock ground with a faint rule */
  :root {
    --bg: #f3ecdd;
    --paper-line: #e3d8bf;
    --surface: #fffdf7;
    --ink: #201c16;
    --ink-dim: #6b6256;
    --accent: #b8791f;
    --accent-ink: #2a1a05;
    --border: #ddd0b2;
    --correct: #2f7a4d;
    --correct-bg: #e3f1e6;
    --incorrect: #b8392f;
    --incorrect-bg: #f6e3e0;
    --shadow: 0 1px 0 rgba(32,28,22,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171510;
      --paper-line: #231f17;
      --surface: #211d16;
      --ink: #efe8d8;
      --ink-dim: #a69a85;
      --accent: #e3a83f;
      --accent-ink: #1b1204;
      --border: #3a3326;
      --correct: #6cc98d;
      --correct-bg: #1d2a1f;
      --incorrect: #e2756b;
      --incorrect-bg: #2d1e1b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171510;
    --paper-line: #231f17;
    --surface: #211d16;
    --ink: #efe8d8;
    --ink-dim: #a69a85;
    --accent: #e3a83f;
    --accent-ink: #1b1204;
    --border: #3a3326;
    --correct: #6cc98d;
    --correct-bg: #1d2a1f;
    --incorrect: #e2756b;
    --incorrect-bg: #2d1e1b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    background:
      repeating-linear-gradient(to bottom, transparent 0 38px, var(--paper-line) 38px 39px),
      var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding-inline: 16px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 640px; min-width: 0; padding-block: 36px 48px; }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .masthead .name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 900;
    font-size: clamp(28px, 8vw, 38px);
    letter-spacing: -0.01em;
  }
  .masthead .meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-align: right;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 28px;
    min-width: 0;
  }
  @media (max-width: 480px) { .card { padding: 18px 14px; } }

  /* ---------- start screen ---------- */
  .start-copy { font-size: 16px; line-height: 1.55; color: var(--ink-dim); max-width: 50ch; }
  .start-stats {
    display: flex; gap: 10px; margin: 22px 0; flex-wrap: wrap;
  }
  .stat-chip {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }
  .sections-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .streak-chip { color: var(--accent-ink); border-color: var(--accent); }
  .link-archive {
    display: block; margin-top: 14px; background: none; border: none; cursor: pointer;
    font-family: "IBM Plex Sans", sans-serif; font-size: 13px; color: var(--ink-dim);
    text-decoration: underline; text-underline-offset: 3px; padding: 4px 0;
  }
  .link-archive:hover { color: var(--accent); }
  .streak-line {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--accent-ink);
    margin: 10px 0 2px;
  }

  /* ---------- archive list ---------- */
  .archive-header { margin-bottom: 6px; }
  .link-back {
    background: none; border: none; cursor: pointer; padding: 4px 0;
    font-family: "IBM Plex Sans", sans-serif; font-size: 13px; color: var(--ink-dim);
  }
  .link-back:hover { color: var(--accent); }
  .link-back.inline { font-size: inherit; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .archive-title { font-family: "Fraunces", serif; font-size: 22px; font-weight: 700; margin: 6px 0 4px; }
  .archive-note { font-size: 13px; color: var(--ink-dim); margin-bottom: 18px; }
  .archive-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
  .archive-item {
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    background: var(--surface); cursor: pointer; font-family: "IBM Plex Sans", sans-serif;
    font-size: 14px; color: var(--ink); text-align: left;
  }
  .archive-item:hover { border-color: var(--accent); }
  .archive-num { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-dim); }
  .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--ink-dim);
  }

  button.primary {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 15px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    padding: 13px 24px;
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.05); }
  button.primary:focus-visible, button.ghost:focus-visible, .bubble:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.ghost {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ---------- progress dots ---------- */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    flex: none;
  }
  .dot.current { border-color: var(--accent); background: var(--accent); }
  .dot.correct { border-color: var(--correct); background: var(--correct); }
  .dot.incorrect { border-color: var(--incorrect); background: var(--incorrect); }
  .progress-count {
    margin-left: auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-dim);
  }

  /* ---------- timer ---------- */
  .timer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .timer-track {
    flex: 1; height: 6px; border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .timer-fill {
    height: 100%; width: 100%;
    background: var(--accent);
    transition: width 1s linear, background-color 0.3s;
  }
  .timer-fill.danger { background: var(--incorrect); }
  .timer-num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-dim);
    min-width: 30px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .timer-num.danger { color: var(--incorrect); }

  .q-tag { margin-bottom: 14px; }
  .q-prompt {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(18px, 5vw, 23px);
    line-height: 1.35;
    margin-bottom: 4px;
    text-wrap: balance;
  }
  .q-passage {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink-dim);
    border-left: 2px solid var(--border);
    padding-left: 14px;
    margin: 14px 0 18px;
    font-style: italic;
  }
  .q-table-wrap { overflow-x: auto; margin: 14px 0 18px; }
  .q-table {
    width: 100%;
    border-collapse: collapse;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
  }
  .q-table th, .q-table td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .q-table th { color: var(--ink-dim); font-weight: 500; }

  .options { display: flex; flex-direction: column; gap: 10px; margin: 20px 0 8px; }
  .bubble {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    cursor: pointer;
  }
  .bubble:hover:not(:disabled) { border-color: var(--accent); }
  .bubble:disabled { cursor: default; }
  .letter {
    flex: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-dim);
  }
  .bubble.picked .letter { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .bubble.show-correct { border-color: var(--correct); background: var(--correct-bg); }
  .bubble.show-correct .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .bubble.show-incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
  .bubble.show-incorrect .letter { background: var(--incorrect); border-color: var(--incorrect); color: #fff; }

  .verdict { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-weight: 600; font-size: 14.5px; }
  .verdict.correct { color: var(--correct); }
  .verdict.incorrect { color: var(--incorrect); }
  .explain { font-size: 14px; line-height: 1.6; color: var(--ink-dim); margin-bottom: 20px; }

  /* ---------- results ---------- */
  .score-hero { display: flex; align-items: baseline; gap: 16px; margin-bottom: 6px; flex-wrap: wrap; }
  .score-big {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 900;
    font-size: clamp(46px, 14vw, 64px);
    line-height: 1;
  }
  .score-label { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--ink-dim); letter-spacing: 0.04em; text-transform: uppercase; }
  .score-verdict { font-size: 16px; color: var(--ink-dim); margin-bottom: 24px; }

  .breakdown { display: flex; flex-direction: column; gap: 0; margin-bottom: 8px; border-top: 1px solid var(--border); }
  .b-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .b-row .b-tag { width: 72px; flex: none; }
  .b-row .b-q { flex: 1; color: var(--ink-dim); min-width: 0; }
  .b-row .b-mark { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px; flex: none; }
  .b-row .b-mark.correct { color: var(--correct); }
  .b-row .b-mark.incorrect { color: var(--incorrect); }

  /* ---------- today's players ---------- */
  .compare { margin: 26px 0 24px; border-top: 1px solid var(--border); padding-top: 20px; }
  .compare-title {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 12px;
  }
  .percentile-line { font-size: 15px; margin-bottom: 4px; }
  .percentile-line b { color: var(--accent); }
  .time-line { margin-top: 16px; }
  .compare-sub { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-dim); }
  .compare-note { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 110px; margin-top: 16px; padding: 0 2px; }
  .bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .bar-count { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-dim); }
  .bar-col.mine .bar-count { color: var(--accent); font-weight: 600; }
  .bar-track { width: 100%; max-width: 44px; flex: 1; display: flex; align-items: flex-end; }
  .bar-fill { width: 100%; border-radius: 6px 6px 2px 2px; background: var(--border); }
  .bar-fill.mine { background: var(--accent); }
  .bar-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-dim); font-weight: 600; }
  .bar-col.mine .bar-label { color: var(--accent); }

  .copy-note { font-size: 12.5px; color: var(--ink-dim); }
  .lock-note { margin-top: 16px; font-size: 12.5px; color: var(--ink-dim); }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  }
</style>
</head>
<body>


<div class="wrap">
  <div class="masthead">
    <div class="name">ACTLE</div>
    <div class="meta" id="puzzle-meta">4 questions<br>60 seconds each</div>
  </div>

  <div class="card" id="card">
    <!-- content injected by script -->
  </div>
</div>

<script>
(function(){
  var TIME_LIMIT = 60;
  var SECTION_EMOJI = { Math: "🧮", English: "🔤", Reading: "📖", Science: "🔬" };
  var SECTIONS = ["Math", "English", "Reading", "Science"];

  var POOLS = {
    Math: [
      { prompt: "If 3x − 7 = 2x + 5, what is x?", options: ["−12", "2/5", "5", "12"], correct: 3,
        explain: "Subtract 2x from both sides to get x − 7 = 5, then add 7: x = 12." },
      { prompt: "Solve for x: 5(x − 2) = 3x + 4", options: ["3", "5", "7", "10"], correct: 2,
        explain: "Distribute to get 5x − 10 = 3x + 4, then combine like terms: 2x = 14, so x = 7." },
      { prompt: "What is 15% of 240?", options: ["24", "30", "36", "40"], correct: 2,
        explain: "15% of 240 = 0.15 × 240 = 36." },
      { prompt: "A rectangle has a length of 9 and a width of 4. What is its perimeter?", options: ["13", "26", "36", "40"], correct: 1,
        explain: "Perimeter = 2(length + width) = 2(9 + 4) = 26." },
      { prompt: "If f(x) = 2x² − 3, what is f(3)?", options: ["9", "12", "15", "18"], correct: 2,
        explain: "f(3) = 2(3)² − 3 = 2(9) − 3 = 15." },
      { prompt: "What is the slope of the line through (2, 3) and (6, 11)?", options: ["1", "2", "4", "8"], correct: 1,
        explain: "Slope = (11 − 3) / (6 − 2) = 8/4 = 2." },
      { prompt: "Simplify: x³ × x²", options: ["x⁵", "x⁶", "x", "x¹⁰"], correct: 0,
        explain: "When multiplying powers with the same base, add the exponents: 3 + 2 = 5, so x³ × x² = x⁵." },
      { prompt: "Solve for x: 2(x + 3) = 4x − 2", options: ["2", "3", "4", "6"], correct: 2,
        explain: "Distribute: 2x + 6 = 4x − 2, so 8 = 2x, and x = 4." },
      { prompt: "What is the value of 7² − 3²?", options: ["28", "34", "40", "46"], correct: 2,
        explain: "7² − 3² = 49 − 9 = 40." },
      { prompt: "A bag has 5 red and 7 blue marbles. What fraction of the marbles are red?", options: ["5/12", "7/12", "5/7", "1/2"], correct: 0,
        explain: "There are 12 marbles total, 5 of them red, so the fraction is 5/12." },
      { prompt: "If y = 3x + 1 and x = 4, what is y?", options: ["10", "12", "13", "14"], correct: 2,
        explain: "y = 3(4) + 1 = 12 + 1 = 13." },
      { prompt: "What is the least common multiple of 4 and 6?", options: ["10", "12", "18", "24"], correct: 1,
        explain: "Multiples of 4: 4, 8, 12… Multiples of 6: 6, 12… The smallest shared multiple is 12." },
      { prompt: "A triangle has angles of 40° and 65°. What is the third angle?", options: ["65°", "70°", "75°", "80°"], correct: 2,
        explain: "A triangle's angles sum to 180°, so the third angle is 180 − 40 − 65 = 75°." },
      { prompt: "Simplify: (2x)(3x²)", options: ["5x³", "6x²", "6x³", "6x"], correct: 2,
        explain: "Multiply coefficients (2×3=6) and add exponents (1+2=3): 6x³." },
      { prompt: "What is 7/8 as a decimal, rounded to the nearest hundredth?", options: ["0.78", "0.85", "0.88", "0.90"], correct: 2,
        explain: "7 ÷ 8 = 0.875, which rounds to 0.88." },
      { prompt: "A car travels 180 miles in 3 hours. What is its average speed?", options: ["45 mph", "55 mph", "60 mph", "65 mph"], correct: 2,
        explain: "Speed = distance ÷ time = 180 ÷ 3 = 60 mph." },
      { prompt: "What is the median of: 4, 9, 2, 11, 7?", options: ["4", "7", "9", "11"], correct: 1,
        explain: "Sorted, the values are 2, 4, 7, 9, 11 — the middle value is 7." },
      { prompt: "Solve for x: x/3 + 5 = 9", options: ["4", "9", "12", "27"], correct: 2,
        explain: "Subtract 5: x/3 = 4. Multiply by 3: x = 12." },
      { prompt: "A square has an area of 49. What is its perimeter?", options: ["14", "21", "28", "49"], correct: 2,
        explain: "The side length is √49 = 7, so the perimeter is 4 × 7 = 28." },
      { prompt: "What is 20% of 85?", options: ["15", "17", "20", "25"], correct: 1,
        explain: "20% of 85 = 0.2 × 85 = 17." },
      { prompt: "If 2^x = 32, what is x?", options: ["4", "5", "6", "16"], correct: 1,
        explain: "2⁵ = 32, so x = 5." },
      { prompt: "Simplify: 5x − (2x − 7)", options: ["3x − 7", "3x + 7", "7x − 7", "7x + 7"], correct: 1,
        explain: "Distribute the negative: 5x − 2x + 7 = 3x + 7." },
      { prompt: "Two numbers have a sum of 24 and a difference of 6. What is the larger number?", options: ["12", "15", "18", "21"], correct: 1,
        explain: "15 + 9 = 24 and 15 − 9 = 6, so the larger number is 15." },
      { prompt: "What is the volume of a cube with side length 3?", options: ["9", "18", "27", "81"], correct: 2,
        explain: "Volume = side³ = 3³ = 27." },
      { prompt: "If f(x) = x² + 2x, what is f(−3)?", options: ["−3", "3", "9", "15"], correct: 1,
        explain: "f(−3) = (−3)² + 2(−3) = 9 − 6 = 3." },
      { prompt: "Convert 3/4 to a percent.", options: ["34%", "65%", "75%", "80%"], correct: 2,
        explain: "3/4 = 0.75 = 75%." },
      { prompt: "A rectangle's length is twice its width. If the width is 6, what is the area?", options: ["36", "48", "72", "96"], correct: 2,
        explain: "Length = 12, so area = 12 × 6 = 72." },
      { prompt: "Solve for x: 4x + 9 = x + 21", options: ["3", "4", "5", "12"], correct: 1,
        explain: "Subtract x and 9: 3x = 12, so x = 4." },
      { prompt: "What is the greatest common factor of 18 and 24?", options: ["2", "3", "6", "9"], correct: 2,
        explain: "18 = 2×3² and 24 = 2³×3; the shared factors give a GCF of 6." },
      { prompt: "A $40 shirt is discounted 25%. What is the sale price?", options: ["$25", "$30", "$32", "$35"], correct: 1,
        explain: "25% of 40 is 10, so the sale price is 40 − 10 = $30." },
      { prompt: "What is the sum of the interior angles of a hexagon?", options: ["540°", "630°", "720°", "900°"], correct: 2,
        explain: "Interior angle sum = (n − 2) × 180° = (6 − 2) × 180° = 720°." },
      { prompt: "If 4x + 3 = 19, what is x?", options: ["3", "4", "5", "7"], correct: 1,
        explain: "Subtract 3 from both sides: 4x = 16, so x = 4." },
      { prompt: "What is 30% of 150?", options: ["30", "35", "40", "45"], correct: 3,
        explain: "30% of 150 = 0.30 × 150 = 45." },
      { prompt: "Simplify: 3(2x − 4) + 5", options: ["6x − 7", "6x − 12", "6x + 5", "6x − 17"], correct: 0,
        explain: "Distribute to get 6x − 12, then add 5: 6x − 7." },
      { prompt: "A triangle has sides 6, 8, and 10. What type of triangle is it?", options: ["acute", "right", "obtuse", "equilateral"], correct: 1,
        explain: "6² + 8² = 36 + 64 = 100 = 10², so the Pythagorean theorem confirms this is a right triangle." },

      { passage: "The museum’s newest exhibit displayed the explorer’s journals beside the equipment he’d carried — a compass with a cracked face, a coat worn thin at the elbows.",

        explain: "The wear described — cracked, worn thin — points to extensive use over a difficult journey." },
      { passage: "Every email from the new manager ended with the same line: ‘Let me know if anything is unclear.’ After a month, no one had ever taken her up on it.",

      { passage: "The chess club had met every Thursday for a decade, but when the new coach proposed moving practice to Mondays, three of the oldest members quit within the week.",

        explain: "Quitting over a schedule change, not the game itself, suggests the tradition mattered more than chess." },
      { passage: "The baker arrived at four each morning, long before the town stirred, and by the time the first customer entered, the shelves were already half empty from deliveries made to hotels across the river.",
        prompt: "This passage suggests that the bakery's business depends significantly on:", options: [
          "walk-in customers.", "wholesale deliveries.", "online orders.", "evening sales." ], correct: 1,
        explain: "Half the shelves are already gone to hotel deliveries before the first walk-in customer arrives." },
      { passage: "Despite owning the patent for over a decade, the inventor never built the device herself; she sold the rights to a company that promised, and then failed, to bring it to market.",

      { passage: "The hikers had packed for a two-day trip, but the trail closure sign at the summit meant retracing six extra miles before nightfall.",

      { passage: "Theo's grandmother repeated the same four recipes every holiday for thirty years, insisting that a fifth would 'break the magic.'",

        explain: "Refusing even a fifth recipe for thirty years shows she treated the set as a fixed, meaningful ritual." },
      { passage: "The startup's first product failed within months, but the founders kept the whiteboard sketches from that version taped above their desks for the next five years.",

          "treated the failure as something worth remembering.", "planned to rebuild the same product." ], correct: 2,
        explain: "Displaying the sketches for five years shows they chose to remember the failure, not hide it." },
      { passage: "Every letter the soldier sent home described the weather and nothing else, yet his sister read each one three times before folding it away.",
        prompt: "The sister's behavior suggests that she:", options: [
          "found the letters boring.", "valued the letters beyond their literal content.",
          "was confused by the letters.", "preferred longer letters." ], correct: 1,
        explain: "Reading plain weather reports three times shows she valued them for more than their literal words." },
      { passage: "The committee debated the budget for six hours, yet the final vote passed in under a minute, with no discussion at all.",
        prompt: "This contrast mainly suggests that by the time of the vote, the committee members:", options: [
          "had already reached agreement.", "were still deeply divided.",
          "had forgotten the topic.", "wanted to delay further." ], correct: 0,
        explain: "A fast, discussion-free vote after a long debate suggests agreement had already been reached." },
      { passage: "The shop had sold typewriters for sixty years. When the owner's grandson took over, the front window still displayed the same model from 1962 — now beside a hand-written sign reading 'We repair laptops too.'",
        prompt: "The new sign mainly suggests that the shop is:", options: [
          "closing permanently.", "adapting while keeping its history visible.",
          "abandoning its old identity entirely.", "only repairing typewriters now." ], correct: 1,
        explain: "Keeping the old typewriter display while adding a laptop-repair sign shows the shop adapting without erasing its past." },
      { passage: "Every runner in the race had trained for months, but only Priya checked the weather forecast the night before and packed a second pair of shoes.",
        prompt: "This detail about Priya suggests she was especially:", options: ["overconfident.", "prepared for uncertainty.", "inexperienced.", "careless."], correct: 1,
        explain: "Checking the forecast and packing a backup shows preparation for conditions that might change." },
      { passage: "The village had no doctor, so when the traveling physician arrived twice a year, the line outside her tent began forming before sunrise.",
        prompt: "The length and timing of the line suggests that the physician's visits were:", options: ["unwelcome.", "rare and highly valued.", "frequent and routine.", "unnecessary."], correct: 1,
        explain: "Lines forming before sunrise for a twice-yearly visit show the visits were rare and in high demand." },
      { passage: "The museum guard had walked the same three rooms every night for twenty years. He could describe each painting with his eyes closed, yet he still paused at the same spot each night to look.",
        prompt: "The guard's nightly pause suggests that, despite familiarity, the paintings still:", options: ["bored him.", "held his genuine interest.", "were invisible to him.", "changed every night."], correct: 1,
        explain: "Pausing to look night after night, despite total familiarity, shows ongoing genuine interest." },
      { passage: "The company's new policy allowed employees to work from anywhere, but attendance at the Tuesday morning meeting — held only in person — was still required.",
        prompt: "This detail suggests the Tuesday meeting was considered:", options: ["unimportant to leadership.", "important enough to require physical presence.", "optional for most employees.", "about to be cancelled."], correct: 1,
        explain: "Requiring in-person attendance despite a remote-friendly policy shows the meeting was considered especially important." },
      { passage: "The gardener had been warned the soil was too rocky for roses, but she planted them anyway, hauling out stones by hand for three straight weekends.",
        prompt: "This passage mainly illustrates the gardener's:", options: ["carelessness.", "determination.", "indifference to the roses.", "regret."], correct: 1,
        explain: "Three weekends of hand-hauling stones despite a warning shows determination, not carelessness." },
      { passage: "The orchestra's conductor rehearsed the final movement eleven times, though the musicians had already played it perfectly by the fourth.",
        prompt: "This detail suggests the conductor was primarily seeking:", options: ["technical correctness alone.", "something beyond mere accuracy.", "to punish the musicians.", "to shorten the rehearsal."], correct: 1,
        explain: "Continuing well past the point of technical accuracy suggests the conductor wanted something more than correctness." },
      { passage: "The fishermen stopped checking the old lighthouse log the year GPS became standard on every boat, though the logbook itself was never thrown away.",
        prompt: "Keeping the logbook despite disuse suggests the fishermen:", options: ["still relied on it daily.", "felt some attachment to it beyond its practical use.", "planned to sell it.", "found GPS unreliable."], correct: 1,
        explain: "Keeping an unused logbook rather than discarding it suggests an attachment beyond its practical use." },
      { passage: "The professor's office hours were technically one hour a week, but students often found her door open two or three hours past the posted time.",
        prompt: "This detail suggests the professor was:", options: ["strict about her schedule.", "more generous with her time than required.", "frequently absent.", "uninterested in students."], correct: 1,
        explain: "Staying hours past the posted time shows generosity beyond what was formally required." },
      { passage: "The recipe had been passed down for four generations, always handwritten, never typed — even after the family opened a restaurant with a full printed menu.",
        prompt: "The choice to keep the recipe handwritten suggests the family valued:", options: ["efficiency above all else.", "a personal connection to its origin.", "secrecy from customers.", "modern technology."], correct: 1,
        explain: "Keeping it handwritten even after printing a full menu suggests a personal connection mattered more than convenience." },
      { passage: "The astronomer spent eleven years cataloguing a single patch of sky, even after colleagues suggested broader surveys would advance her career faster.",
        prompt: "This passage suggests the astronomer was motivated primarily by:", options: ["career advancement.", "a specific scientific curiosity.", "peer pressure.", "financial reward."], correct: 1,
        explain: "Ignoring career-focused advice to keep studying one patch of sky points to genuine scientific curiosity." },
      { passage: "The old bridge had been condemned for a decade, yet townspeople still walked across it rather than take the mile-long detour the new road required.",
        prompt: "This detail mainly suggests that for the townspeople, the bridge's:", options: ["danger outweighed its convenience.", "convenience outweighed concerns about its condition.", "condition had actually improved.", "location had changed."], correct: 1,
        explain: "Choosing the condemned bridge over a mile-long detour shows convenience winning out over safety concerns." },
      { passage: "The tailor measured each customer twice, even regular customers he had fitted dozens of times before.",
        prompt: "This habit suggests the tailor valued:", options: ["speed over accuracy.", "precision over assumption.", "customer flattery.", "minimizing his workload."], correct: 1,
        explain: "Re-measuring even familiar customers shows he valued precision over assuming nothing had changed." },
      { passage: "The small press had rejected the manuscript twice before finally publishing it — and it went on to outsell every other title the press had released that decade.",
        prompt: "This passage mainly illustrates that:", options: ["the press's judgment was always correct.", "early rejection does not necessarily predict a work's eventual success.", "the manuscript was poorly written.", "the press regretted publishing it."], correct: 1,
        explain: "A twice-rejected manuscript becoming the decade's best-seller shows rejection doesn't predict eventual success." },
      { passage: "The night-shift nurse kept a small notebook of every patient's favorite song, long after hospital policy stopped requiring personal notes in patient files.",
        prompt: "Keeping the notebook despite the policy change suggests the nurse:", options: ["disliked the new policy intensely.", "valued a personal touch beyond what was required.", "wanted to be reprimanded.", "forgot to stop the habit."], correct: 1,
        explain: "Continuing a personal habit no longer required by policy shows she valued that personal touch for its own sake." },
      { passage: "The carpenter refused to use power tools on the chapel's altar, even though the rest of the building had been finished in half the time with them.",
        prompt: "This detail mainly suggests that for the carpenter, the altar held:", options: ["less importance than the rest of the building.", "a significance that called for a different approach.", "no particular significance.", "the same importance as any other piece."], correct: 1,

      { passage: "The violinist had played the same concerto for thirty years, yet before every performance she still practiced the opening measure a dozen times.",
        prompt: "This detail mainly suggests that the violinist:", options: ["had forgotten how to play the piece.", "took nothing about the performance for granted.", "disliked the opening measure.", "was performing for the first time."], correct: 1,
        explain: "Repeating the opening dozens of times after decades of experience shows she still treated every performance with care, not habit." },
      { passage: "The town had voted against the new highway three times, yet construction crews appeared within the month the fourth vote passed — equipment already staged at the edge of town.",
        prompt: "The detail about staged equipment suggests that:", options: ["the fourth vote's outcome was uncertain.", "the builders expected the vote to pass eventually.", "the crews ignored the vote entirely.", "construction had already finished."], correct: 1,
        explain: "Having equipment ready before the vote passed implies the builders anticipated success, not uncertainty." },
      { passage: "Jonas kept every rejection letter from the twelve publishers in a drawer, labeled by date, until the thirteenth press said yes.",
        prompt: "Keeping the letters organized by date mainly suggests that Jonas:", options: ["regretted submitting his work.", "tracked his attempts methodically despite the setbacks.", "planned to publish the rejections.", "had given up on being published."], correct: 1,
        explain: "Carefully dating and keeping each letter shows persistence and organization, not defeat." },
      { passage: "The recipe had been passed down unwritten for three generations, until Mei finally sat with her grandmother for an entire afternoon, measuring each pinch and dash by hand.",
        prompt: "This passage implies that before that afternoon, the recipe was:", options: ["written down precisely.", "never cooked by the family.", "known only through memory and practice.", "a secret kept from Mei."], correct: 2,
        explain: "An “unwritten” recipe passed down for generations was preserved through memory, not documentation — hence the need to measure it for the first time." },
      { passage: "The company's handbook listed forty-two rules for client meetings, yet the top salesperson had broken at least ten of them in her last pitch alone.",
        prompt: "This passage mainly suggests that:", options: ["the handbook's rules fully explain the top salesperson's success.", "strict adherence to the rules may not determine success.", "the salesperson was reprimanded.", "the handbook has since been revised."], correct: 1,
        explain: "The top performer breaking many rules suggests following them isn't what drives her success." },
      { passage: "Every October, the lighthouse museum's guestbook filled with the same signature: a man who never left a note, just his name and the year.",
        prompt: "This detail suggests the man's visits are best described as:", options: ["a one-time event.", "an annual, private ritual.", "a job requirement.", "entirely random."], correct: 1,
        explain: "Returning every October for years, without explanation, points to a personal yearly tradition." },
      { passage: "The architect submitted the same blueprint to the review board five times, changing only the color of the ink each time, until it was finally approved.",

        explain: "If only ink color changed and it was then approved, the real obstacle likely wasn't the design." },
      { passage: "The twins had never agreed on anything, except, every single year, on where to spend the holidays.",

        explain: "“Except” sets the holiday agreement apart from their usual disagreement, marking it as a notable exception." },
      { passage: "The company's founder still answered the customer-service line herself every Friday afternoon, despite having thousands of employees who could do it instead.",

        explain: "Choosing to personally answer calls despite having staff available suggests she values that direct connection." },
      { passage: "The hikers reached the summit just as the clouds rolled in, erasing the view they had climbed six hours to see.",

        explain: "Climbing six hours only to have the view erased by clouds suggests a disappointing, anticlimactic arrival." },
      { passage: "The professor's final exam had one question, worth all one hundred points, and no partial credit.",
        prompt: "This detail about the exam mainly suggests that the professor:", options: ["wanted an easy grading process.", "expected students to demonstrate complete understanding.", "disliked giving exams.", "gave multiple chances to succeed."], correct: 1,

      { passage: "The letter arrived three weeks after the funeral, addressed in handwriting no one in the family recognized.",

      { passage: "The restaurant had one dish on the menu, prepared the same way every night for forty years, and a line out the door regardless of the weather.",

      { passage: "The scientist published her findings twice: once in a journal only specialists would read, and again, rewritten simply, in a magazine for children.",

      { passage: "The two brothers ran the family farm in near silence, communicating mostly through notes left on the barn door.",

      { passage: "The city replaced every streetlamp with a brighter model, except for the one outside the old bookstore, which the owner had specifically requested stay dim.",

      { passage: "The pilot had flown the same route for twenty years and could recite every checkpoint by heart, yet she still read through the entire checklist before every flight.",

      { passage: "The negotiations lasted eleven hours, and when the two sides finally signed the agreement, neither delegation looked satisfied.",

      { passage: "The library kept a single copy of the banned book locked in a case, not for display, but because a grandmother had donated it on the condition it never leave the building.",

      { passage: "The orchestra's conductor rehearsed the final movement sixty times before the premiere, more than any other section of the piece.",

      { passage: "The fisherman threw back every fish under the legal size limit, even on days when he caught nothing else worth keeping.",

      { passage: "The astronauts trained for the six-minute spacewalk for over a year.",

      { passage: "The small-town newspaper still printed a physical edition every week, even though its own survey showed only a dozen subscribers read it in print.",

      { passage: "The chef refused to reveal the recipe for his signature soup, even to the restaurant's new owner, after selling the business.",

      { passage: "The marathon runner slowed to a walk beside a struggling competitor in the final mile, even though it likely cost her a faster finishing time.",

      { passage: "The carpenter kept the first chair he ever built, full of visible mistakes, displayed prominently in his now-famous workshop.",

      { passage: "The village had no traffic lights, yet in thirty years, there had never been a reported accident at its busiest intersection.",

  var LETTERS = ["A", "B", "C", "D"];

  function todayKey() {
    var d = new Date();
    var m = ("0" + (d.getMonth() + 1)).slice(-2);
    var day = ("0" + d.getDate()).slice(-2);
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function puzzleNumber(dateStr) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var epoch = new Date(2026, 0, 1);
    return Math.floor((d - epoch) / 86400000) + 1;
  }
  function buildDaily(dateStr) {
    // each pool holds one slot per day of the month, so every day gets a
    // different question in every section, with no repeats within a month
    var day = parseInt(dateStr.split("-")[2], 10);
    return SECTIONS.map(function (sec) {
      var pool = POOLS[sec];
      var idx = (day - 1) % pool.length;
      var q = pool[idx];
      return Object.assign({ section: sec }, q);
    });
  }

  var currentDayKey = todayKey();
  var QUESTIONS = buildDaily(currentDayKey);

  var card = document.getElementById("card");

  var state = {
    started: false,
    index: 0,
    picked: [],      // index picked per question; -1 means timed out unanswered
    finished: false
  };

  // timer bookkeeping lives outside the persisted/snapshot state
  var timerId = null;
  var timerForIndex = -1;
  var secondsLeft = TIME_LIMIT;

  function prettyDate(dateStr) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function refreshMeta() {
    var meta = document.getElementById("puzzle-meta");
    if (!meta) return;
    meta.innerHTML = "Puzzle #" + puzzleNumber(currentDayKey) + " · " + prettyDate(currentDayKey) + "<br>60 seconds each";
  }
  refreshMeta();

  // check once a minute whether local midnight has passed; if so, load a fresh puzzle
  setInterval(function () {
    var k = todayKey();
    if (k === currentDayKey) return;
    currentDayKey = k;
    QUESTIONS = buildDaily(currentDayKey);
    clearTimer();
    state.started = false;
    state.index = 0;
    state.picked = [];
    state.finished = false;
    refreshMeta();
    render();
  }, 30000);

  function clearTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    timerForIndex = -1;
  }

  function bestScore() {
    try { return JSON.parse(localStorage.getItem("actle-best") || "null"); }
    catch (e) { return null; }
  }
  function saveBest(score) {
    try {
      var best = bestScore();
      if (best === null || score > best) localStorage.setItem("actle-best", JSON.stringify(score));
    } catch (e) {}
  }

  function formatDuration(totalSeconds) {
    var s = Math.max(0, Math.round(totalSeconds));
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60), r = s % 60;
    return m + "m " + (r < 10 ? "0" : "") + r + "s";
  }

  function submittedKey(date) { return "actle-submitted-" + date; }
  function maybeSubmitScore(date, score, timeSeconds) {
    try {
      if (localStorage.getItem(submittedKey(date))) return;
    } catch (e) {}
    fetch("/api/submit-score", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: date, score: score, timeSeconds: timeSeconds })
    }).then(function (r) {
      // only remember success, so a failed attempt can retry on the next play today
      if (r.ok) { try { localStorage.setItem(submittedKey(date), "1"); } catch (e) {} }
    }).catch(function () {});
  }
  function renderCompare(mount, counts, myScore, timeInfo) {
    var total = counts.reduce(function (a, b) { return a + b; }, 0);
    if (total < 1) {
      mount.innerHTML = '<div class="compare-note">You’re the first to finish today’s ACTLE. Check back later to see how others do.</div>';
      return;
    }
    var below = 0;
    for (var s = 0; s < myScore; s++) below += counts[s];
    var pct = Math.round((below / total) * 100);
    var max = Math.max.apply(null, counts.concat([1]));
    var barsHtml = counts.map(function (c, s) {
      var h = Math.max(Math.round((c / max) * 100), c > 0 ? 6 : 2);
      var mine = s === myScore;
      return '<div class="bar-col' + (mine ? " mine" : "") + '">' +
        '<span class="bar-count">' + c + '</span>' +
        '<div class="bar-track"><div class="bar-fill' + (mine ? " mine" : "") + '" style="height:' + h + '%"></div></div>' +
        '<span class="bar-label">' + s + '/4</span>' +
        '</div>';
    }).join("");

    var timeLine = "";
    if (timeInfo && typeof timeInfo.myTimeSeconds === "number") {
      var timeText = "You finished in <b>" + formatDuration(timeInfo.myTimeSeconds) + "</b>";
      if (typeof timeInfo.fasterThanPercent === "number") {
        timeText += ", faster than <b>" + timeInfo.fasterThanPercent + "%</b> of today’s players.";
      } else {
        timeText += ". Check back later to see how your time compares.";
      }
      timeLine = '<div class="percentile-line time-line">' + timeText + '</div>';
    }

    mount.innerHTML =
      '<div class="percentile-line">Better than <b>' + pct + '%</b> of today’s players.</div>' +
      '<div class="compare-sub">' + total + ' ' + (total === 1 ? "player has" : "players have") + ' finished today’s ACTLE.</div>' +
      '<div class="bars">' + barsHtml + '</div>' +
      timeLine;
  }
  function loadStats(date, mount, myScore, myTimeSeconds) {
    var url = "/api/stats?date=" + encodeURIComponent(date);
    if (typeof myTimeSeconds === "number") url += "&time=" + encodeURIComponent(myTimeSeconds);
    fetch(url)
      .then(function (r) { if (!r.ok) throw new Error("bad response"); return r.json(); })
      .then(function (data) { renderCompare(mount, data.counts || [0,0,0,0,0], myScore, data.time); })
      .catch(function () {
        mount.innerHTML = '<div class="compare-note">Today’s comparison isn’t available right now.</div>';
      });
  }

  // ---------- streaks ----------
  function loadStreakInfo() {
    try { return JSON.parse(localStorage.getItem("actle-streak") || "null"); }
    catch (e) { return null; }
  }
  function priorDateKey(date) {
    var d = new Date(date + "T00:00:00");
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  // records that today's real (non-archive) puzzle was completed, extending the
  // streak if yesterday was also played; safe to call more than once per day
  function updateStreak(date) {
    var info = loadStreakInfo() || { lastDate: null, count: 0 };
    if (info.lastDate === date) return info;
    var count = info.lastDate === priorDateKey(date) ? info.count + 1 : 1;
    var next = { lastDate: date, count: count };
    try { localStorage.setItem("actle-streak", JSON.stringify(next)); } catch (e) {}
    return next;
  }
  // what to show before today's play: counts only if the streak is still "live"
  // (last played today or yesterday) — otherwise it's lapsed and shows nothing
  function liveStreakCount(date) {
    var info = loadStreakInfo();
    if (!info) return 0;
    if (info.lastDate === date || info.lastDate === priorDateKey(date)) return info.count;
    return 0;
  }

  // ---------- archive (past puzzles, practice-only — not counted in stats or streaks) ----------
  var ARCHIVE_DAYS = 30;
  var viewingArchive = false;
  function archiveDates() {
    var dates = [];
    for (var i = 1; i <= ARCHIVE_DAYS; i++) {
      dates.push(priorDateKeyN(currentDayKey, i));
    }
    return dates;
  }
  function priorDateKeyN(date, n) {
    var d = new Date(date + "T00:00:00");
    d.setDate(d.getDate() - n);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function activeQuestions() {
    return state.archiveDate ? buildDaily(state.archiveDate) : QUESTIONS;
  }
  function renderArchiveList() {
    clearTimer();
    var dates = archiveDates();
    var itemsHtml = dates.map(function (d) {
      return '<button class="archive-item" data-date="' + d + '">' +
        '<span>' + prettyDate(d) + '</span><span class="archive-num">#' + puzzleNumber(d) + '</span></button>';
    }).join("");
    card.innerHTML =
      '<div class="archive-header"><button class="link-back" id="archive-back">← Back</button></div>' +
      '<div class="archive-title">Past puzzles</div>' +
      '<div class="archive-note">Practice only — these don’t count toward your streak or today’s stats.</div>' +
      '<div class="archive-list">' + itemsHtml + '</div>';
    document.getElementById("archive-back").addEventListener("click", function () {
      viewingArchive = false;
      render();
    });
    Array.prototype.forEach.call(card.querySelectorAll(".archive-item"), function (btn) {
      btn.addEventListener("click", function () {
        var d = btn.getAttribute("data-date");
        viewingArchive = false;
        state = { started: true, index: 0, picked: [], finished: false, archiveDate: d, startedAt: Date.now() };
        clearTimer();
        renderQuestion();
      });
    });
  }

  function resultKey(date) { return "actle-result-" + date; }
  function loadCompletedToday(date) {
    try {
      var raw = localStorage.getItem(resultKey(date));
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.picked)) return parsed;
    } catch (e) {}
    return null;
  }
  function saveCompletedToday(date, picked, score, timeSeconds) {
    try { localStorage.setItem(resultKey(date), JSON.stringify({ picked: picked, score: score, timeSeconds: timeSeconds })); } catch (e) {}
  }

  function render() {
    if (viewingArchive) return renderArchiveList();
    // one attempt per day: if today's puzzle was already finished (even in an
    // earlier visit or before a reload), jump straight to the locked result.
    // archive plays are exempt — they're practice runs, not the daily lock.
    if (!state.finished && !state.archiveDate) {
      var completed = loadCompletedToday(currentDayKey);
      if (completed) {
        state.started = true;
        state.picked = completed.picked.slice();
        state.finished = true;
        // older saved results (before timing was added) won't have this — that's fine,
        // renderResults() just skips the time comparison in that case
        state.timeSeconds = typeof completed.timeSeconds === "number" ? completed.timeSeconds : null;
      }
    }
    if (!state.started) return renderStart();
    if (state.finished) return renderResults();
    return renderQuestion();
  }

  function renderStart() {
    clearTimer();
    var best = bestScore();
    var bestLine = best === null ? "" :
      '<div class="stat-chip">Best so far · ' + best + '/4</div>';
    var streak = liveStreakCount(currentDayKey);
    var streakLine = streak < 1 ? "" :
      '<div class="stat-chip streak-chip">🔥 ' + streak + ' day streak</div>';
    card.innerHTML =
      '<div class="start-copy">One question from each ACT section: Math, English, Reading, Science. You get 60 seconds on the clock per question, then the answer locks in and you see how you did.</div>' +
      '<div class="sections-preview">' +
        '<span class="tag">Math</span><span class="tag">English</span><span class="tag">Reading</span><span class="tag">Science</span>' +
      '</div>' +
      '<div class="start-stats"><div class="stat-chip">4 questions</div><div class="stat-chip">60s each</div>' + bestLine + streakLine + '</div>' +
      '<button class="primary" id="go">Start the clock</button>' +
      '<button class="link-archive" id="archive-link">Play past puzzles →</button>';
    document.getElementById("go").addEventListener("click", function () {
      state.started = true;
      state.startedAt = Date.now();
      render();
    });
    document.getElementById("archive-link").addEventListener("click", function () {
      viewingArchive = true;
      render();
    });
  }

  function paintTimer() {
    var fill = document.getElementById("timer-fill");
    var num = document.getElementById("timer-num");
    if (!fill || !num) return;
    var pct = Math.max(0, (secondsLeft / TIME_LIMIT) * 100);
    fill.style.width = pct + "%";
    num.textContent = secondsLeft + "s";
    var danger = secondsLeft <= 10;
    fill.classList.toggle("danger", danger);
    num.classList.toggle("danger", danger);
  }

  function startTimerIfNeeded(i) {
    if (timerForIndex === i) { paintTimer(); return; }
    clearTimer();
    timerForIndex = i;
    secondsLeft = TIME_LIMIT;
    paintTimer();
    timerId = setInterval(function () {
      secondsLeft--;
      if (secondsLeft <= 0) {
        clearTimer();
        state.picked[i] = -1;
        render();
        return;
      }
      paintTimer();
    }, 1000);
  }

  function renderQuestion() {
    var Q = activeQuestions();
    var i = state.index;
    var q = Q[i];
    var picked = state.picked[i];
    var answered = picked !== undefined;

    var dots = "";
    for (var d = 0; d < Q.length; d++) {
      var cls = "dot";
      if (d === i && !answered) cls += " current";
      else if (state.picked[d] !== undefined) {
        cls += state.picked[d] === Q[d].correct ? " correct" : " incorrect";
      }
      dots += '<span class="' + cls + '"></span>';
    }

    var passageHtml = q.passage ? '<div class="q-passage">' + q.passage + '</div>' : "";
    var tableHtml = "";
    if (q.table) {
      tableHtml = '<div class="q-table-wrap"><table class="q-table"><thead><tr>' +
        q.table.headers.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
        '</tr></thead><tbody><tr>' +
        q.table.row.map(function (c) { return "<td>" + c + "</td>"; }).join("") +
        '</tr></tbody></table></div>';
    }

    var optionsHtml = q.options.map(function (opt, oi) {
      var cls = "bubble";
      var dis = "";
      if (answered) {
        dis = "disabled";
        if (oi === q.correct) cls += " show-correct";
        else if (oi === picked) cls += " show-incorrect";
        if (oi === picked && picked > -1) cls += " picked";
      }
      return '<button class="' + cls + '" data-i="' + oi + '" ' + dis + '>' +
        '<span class="letter">' + LETTERS[oi] + '</span><span>' + opt + '</span></button>';
    }).join("");

    var verdictHtml = "";
    if (answered) {
      var timedOut = picked === -1;
      var isRight = !timedOut && picked === q.correct;
      var label = timedOut ? "Time’s up" : (isRight ? "Correct" : "Not quite");
      verdictHtml =
        '<div class="verdict ' + (isRight ? "correct" : "incorrect") + '">' + label + '</div>' +
        '<div class="explain">' + q.explain + '</div>' +
        '<div class="btn-row"><button class="primary" id="next">' +
        (i === Q.length - 1 ? "See results" : "Next question") + '</button></div>';
    }

    card.innerHTML =
      '<div class="progress-row">' + dots + '<span class="progress-count">' + (i + 1) + ' / ' + Q.length + '</span></div>' +
      (answered ? "" : '<div class="timer-row"><div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div><span class="timer-num" id="timer-num">' + secondsLeft + 's</span></div>') +
      '<div class="q-tag"><span class="tag">' + q.section + '</span></div>' +
      '<div class="q-prompt">' + q.prompt + '</div>' +
      passageHtml + tableHtml +
      '<div class="options">' + optionsHtml + '</div>' +
      verdictHtml;

    if (!answered) {
      startTimerIfNeeded(i);
      Array.prototype.forEach.call(card.querySelectorAll(".bubble"), function (b) {
        b.addEventListener("click", function () {
          clearTimer();
          state.picked[i] = parseInt(b.getAttribute("data-i"), 10);
          render();
        });
      });
    } else {
      clearTimer();
      document.getElementById("next").addEventListener("click", function () {
        if (i === Q.length - 1) {
          state.finished = true;
        } else {
          state.index++;
        }
        render();
      });
    }
  }

  function renderResults() {
    clearTimer();
    var isArchive = !!state.archiveDate;
    var Q = activeQuestions();
    var score = 0;
    var rows = Q.map(function (q, i) {
      var right = state.picked[i] === q.correct;
      if (right) score++;
      return { q: q, right: right, timedOut: state.picked[i] === -1 };
    });

    var timeSeconds = typeof state.timeSeconds === "number" ? state.timeSeconds :
      Math.max(1, Math.round((Date.now() - (state.startedAt || Date.now())) / 1000));
    state.timeSeconds = timeSeconds;

    var streakInfo = null;
    if (!isArchive) {
      saveBest(score);
      saveCompletedToday(currentDayKey, state.picked, score, timeSeconds);
      streakInfo = updateStreak(currentDayKey);
    }

    var verdictText = [
      "Worth another lap. Review the explanations and try again.",
      "A rough start, but the pattern's there.",
      "Right down the middle, solid, with room to sharpen.",
      "Almost there. Just one slipped past.",
      "Clean sweep. All four, no mistakes."
    ][score];

    var breakdownHtml = rows.map(function (r) {
      var markText = r.right ? "Correct" : (r.timedOut ? "Timed out" : "Missed");
      return '<div class="b-row"><span class="tag b-tag">' + r.q.section + '</span>' +
        '<span class="b-q">' + r.q.prompt + '</span>' +
        '<span class="b-mark ' + (r.right ? "correct" : "incorrect") + '">' + markText + '</span></div>';
    }).join("");

    var streakHtml = streakInfo ? '<div class="streak-line">🔥 ' + streakInfo.count + (streakInfo.count === 1 ? " day streak" : " day streak") + '</div>' : "";

    var compareHtml = isArchive
      ? '<div class="compare-note">Archive run: practice only, not counted in today’s stats.</div>'
      : '<div class="compare-title">Today’s players</div><div id="compare-mount"><div class="compare-note">Loading today’s comparison…</div></div>';

    var footerHtml = isArchive
      ? '<div class="lock-note">Puzzle #' + puzzleNumber(state.archiveDate) + ' · ' + prettyDate(state.archiveDate) + ' · ' +
        '<button class="link-back inline" id="archive-again">more past puzzles</button> · ' +
        '<button class="link-back inline" id="archive-today">back to today</button></div>'
      : '<div class="lock-note">That’s today’s ACTLE. Come back after midnight for a new puzzle.<br>' +
        '<button class="link-archive" id="archive-link">Play past puzzles →</button></div>';

    card.innerHTML =
      '<div class="score-hero"><span class="score-big">' + score + '/4</span><span class="score-label">Final score</span></div>' +
      '<div class="score-verdict">' + verdictText + '</div>' +
      streakHtml +
      '<div class="breakdown">' + breakdownHtml + '</div>' +
      '<div class="compare">' + compareHtml + '</div>' +
      '<div class="btn-row">' +
        '<button class="primary" id="share">Share score</button>' +
        '<span class="copy-note" id="copy-note" hidden>Copied. Paste it anywhere.</span>' +
      '</div>' +
      footerHtml;

    if (isArchive) {
      document.getElementById("archive-again").addEventListener("click", function () {
        viewingArchive = true;
        state = { started: false, index: 0, picked: [], finished: false };
        render();
      });
      document.getElementById("archive-today").addEventListener("click", function () {
        state = { started: false, index: 0, picked: [], finished: false };
        render();
      });
    } else {
      maybeSubmitScore(currentDayKey, score, timeSeconds);
      loadStats(currentDayKey, document.getElementById("compare-mount"), score, timeSeconds);
      document.getElementById("archive-link").addEventListener("click", function () {
        viewingArchive = true;
        render();
      });
    }

    document.getElementById("share").addEventListener("click", function () {
      var grid = rows.map(function (r) {
        return SECTION_EMOJI[r.q.section] + (r.right ? "✅" : "❌");
      }).join(" ");
      var shareUrl = "https://actle.org";
      var text = isArchive
        ? "I scored " + score + "/4 on an ACTLE archive puzzle!\n" + grid
        : "I scored " + score + "/4 on ACTLE today!\n" + grid;
      var note = document.getElementById("copy-note");
      function showNote() { note.hidden = false; setTimeout(function () { note.hidden = true; }, 1800); }

      if (navigator.share) {
        // iOS Messages drops the "text" field and shows only a link card when
        // "url" is set separately, so fold the link into the text itself instead.
        navigator.share({ title: "ACTLE", text: text + "\n" + shareUrl }).catch(function () {
          // user canceled the share sheet, or the browser refused it — either way, no error to show
        });
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text + "\n" + shareUrl).then(showNote, showNote);
      } else {
        showNote();
      }
    });
  }

  function boot(data) {
    if (data && typeof data === "object") {
      state = Object.assign(state, data);
    }
    render();
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(function () { return state; });
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
  } else {
    boot({});
  }
})();
</script>

</body>
</html>
