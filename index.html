<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACTLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* layout: one centered scorecard-style panel; a scantron bubble row per question; a paper-stock ground with a faint rule */
  :root {
    --bg: #f3ecdd;
    --paper-line: #e3d8bf;
    --surface: #fffdf7;
    --ink: #201c16;
    --ink-dim: #6b6256;
    --accent: #b8791f;
    --accent-ink: #2a1a05;
    --border: #ddd0b2;
    --correct: #2f7a4d;
    --correct-bg: #e3f1e6;
    --incorrect: #b8392f;
    --incorrect-bg: #f6e3e0;
    --shadow: 0 1px 0 rgba(32,28,22,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171510;
      --paper-line: #231f17;
      --surface: #211d16;
      --ink: #efe8d8;
      --ink-dim: #a69a85;
      --accent: #e3a83f;
      --accent-ink: #1b1204;
      --border: #3a3326;
      --correct: #6cc98d;
      --correct-bg: #1d2a1f;
      --incorrect: #e2756b;
      --incorrect-bg: #2d1e1b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171510;
    --paper-line: #231f17;
    --surface: #211d16;
    --ink: #efe8d8;
    --ink-dim: #a69a85;
    --accent: #e3a83f;
    --accent-ink: #1b1204;
    --border: #3a3326;
    --correct: #6cc98d;
    --correct-bg: #1d2a1f;
    --incorrect: #e2756b;
    --incorrect-bg: #2d1e1b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    background:
      repeating-linear-gradient(to bottom, transparent 0 38px, var(--paper-line) 38px 39px),
      var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding-inline: 16px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 640px; min-width: 0; padding-block: 36px 48px; }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .masthead .name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 900;
    font-size: clamp(28px, 8vw, 38px);
    letter-spacing: -0.01em;
  }
  .masthead .meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-align: right;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 28px;
    min-width: 0;
  }
  @media (max-width: 480px) { .card { padding: 18px 14px; } }

  /* ---------- start screen ---------- */
  .start-copy { font-size: 16px; line-height: 1.55; color: var(--ink-dim); max-width: 50ch; }
  .start-stats {
    display: flex; gap: 10px; margin: 22px 0; flex-wrap: wrap;
  }
  .stat-chip {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }
  .sections-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    color: var(--ink-dim);
  }

  button.primary {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 15px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    padding: 13px 24px;
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.05); }
  button.primary:focus-visible, button.ghost:focus-visible, .bubble:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.ghost {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ---------- progress dots ---------- */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    flex: none;
  }
  .dot.current { border-color: var(--accent); background: var(--accent); }
  .dot.correct { border-color: var(--correct); background: var(--correct); }
  .dot.incorrect { border-color: var(--incorrect); background: var(--incorrect); }
  .progress-count {
    margin-left: auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-dim);
  }

  /* ---------- timer ---------- */
  .timer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .timer-track {
    flex: 1; height: 6px; border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .timer-fill {
    height: 100%; width: 100%;
    background: var(--accent);
    transition: width 1s linear, background-color 0.3s;
  }
  .timer-fill.danger { background: var(--incorrect); }
  .timer-num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-dim);
    min-width: 30px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .timer-num.danger { color: var(--incorrect); }

  .q-tag { margin-bottom: 14px; }
  .q-prompt {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(18px, 5vw, 23px);
    line-height: 1.35;
    margin-bottom: 4px;
    text-wrap: balance;
  }
  .q-passage {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink-dim);
    border-left: 2px solid var(--border);
    padding-left: 14px;
    margin: 14px 0 18px;
    font-style: italic;
  }
  .q-table-wrap { overflow-x: auto; margin: 14px 0 18px; }
  .q-table {
    width: 100%;
    border-collapse: collapse;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
  }
  .q-table th, .q-table td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .q-table th { color: var(--ink-dim); font-weight: 500; }

  .options { display: flex; flex-direction: column; gap: 10px; margin: 20px 0 8px; }
  .bubble {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    cursor: pointer;
  }
  .bubble:hover:not(:disabled) { border-color: var(--accent); }
  .bubble:disabled { cursor: default; }
  .letter {
    flex: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-dim);
  }
  .bubble.picked .letter { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .bubble.show-correct { border-color: var(--correct); background: var(--correct-bg); }
  .bubble.show-correct .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .bubble.show-incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
  .bubble.show-incorrect .letter { background: var(--incorrect); border-color: var(--incorrect); color: #fff; }

  .verdict { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-weight: 600; font-size: 14.5px; }
  .verdict.correct { color: var(--correct); }
  .verdict.incorrect { color: var(--incorrect); }
  .explain { font-size: 14px; line-height: 1.6; color: var(--ink-dim); margin-bottom: 20px; }

  /* ---------- results ---------- */
  .score-hero { display: flex; align-items: baseline; gap: 16px; margin-bottom: 6px; flex-wrap: wrap; }
  .score-big {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 900;
    font-size: clamp(46px, 14vw, 64px);
    line-height: 1;
  }
  .score-label { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--ink-dim); letter-spacing: 0.04em; text-transform: uppercase; }
  .score-verdict { font-size: 16px; color: var(--ink-dim); margin-bottom: 24px; }

  .breakdown { display: flex; flex-direction: column; gap: 0; margin-bottom: 8px; border-top: 1px solid var(--border); }
  .b-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .b-row .b-tag { width: 72px; flex: none; }
  .b-row .b-q { flex: 1; color: var(--ink-dim); min-width: 0; }
  .b-row .b-mark { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px; flex: none; }
  .b-row .b-mark.correct { color: var(--correct); }
  .b-row .b-mark.incorrect { color: var(--incorrect); }

  /* ---------- today's players ---------- */
  .compare { margin: 26px 0 24px; border-top: 1px solid var(--border); padding-top: 20px; }
  .compare-title {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 12px;
  }
  .percentile-line { font-size: 15px; margin-bottom: 4px; }
  .percentile-line b { color: var(--accent); }
  .compare-sub { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-dim); }
  .compare-note { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 110px; margin-top: 16px; padding: 0 2px; }
  .bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .bar-count { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-dim); }
  .bar-col.mine .bar-count { color: var(--accent); font-weight: 600; }
  .bar-track { width: 100%; max-width: 44px; flex: 1; display: flex; align-items: flex-end; }
  .bar-fill { width: 100%; border-radius: 6px 6px 2px 2px; background: var(--border); }
  .bar-fill.mine { background: var(--accent); }
  .bar-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-dim); font-weight: 600; }
  .bar-col.mine .bar-label { color: var(--accent); }

  .copy-note { font-size: 12.5px; color: var(--ink-dim); }
  .lock-note { margin-top: 16px; font-size: 12.5px; color: var(--ink-dim); }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  }
</style>
</head>
<body>


<div class="wrap">
  <div class="masthead">
    <div class="name">ACTLE</div>
    <div class="meta" id="puzzle-meta">4 questions<br>60 seconds each</div>
  </div>

  <div class="card" id="card">
    <!-- content injected by script -->
  </div>
</div>

<script>
(function(){
  var TIME_LIMIT = 60;
  var SECTION_EMOJI = { Math: "🧮", English: "🔤", Reading: "📖", Science: "🔬" };
  var SECTIONS = ["Math", "English", "Reading", "Science"];

  var POOLS = {
    Math: [
      { prompt: "If 3x − 7 = 2x + 5, what is x?", options: ["−12", "2/5", "5", "12"], correct: 3,
        explain: "Subtract 2x from both sides to get x − 7 = 5, then add 7: x = 12." },
      { prompt: "Solve for x: 5(x − 2) = 3x + 4", options: ["3", "5", "7", "10"], correct: 2,

      { prompt: "What is 15% of 240?", options: ["24", "30", "36", "40"], correct: 2,
        explain: "15% of 240 = 0.15 × 240 = 36." },
      { prompt: "A rectangle has a length of 9 and a width of 4. What is its perimeter?", options: ["13", "26", "36", "40"], correct: 1,
        explain: "Perimeter = 2(length + width) = 2(9 + 4) = 26." },
      { prompt: "If f(x) = 2x² − 3, what is f(3)?", options: ["9", "12", "15", "18"], correct: 2,
        explain: "f(3) = 2(3)² − 3 = 2(9) − 3 = 15." },
      { prompt: "What is the slope of the line through (2, 3) and (6, 11)?", options: ["1", "2", "4", "8"], correct: 1,
        explain: "Slope = (11 − 3) / (6 − 2) = 8/4 = 2." },
      { prompt: "Simplify: x³ × x²", options: ["x⁵", "x⁶", "x", "x¹⁰"], correct: 0,
        explain: "When multiplying powers with the same base, add the exponents: 3 + 2 = 5, so x³ × x² = x⁵." },
      { prompt: "Solve for x: 2(x + 3) = 4x − 2", options: ["2", "3", "4", "6"], correct: 2,
        explain: "Distribute: 2x + 6 = 4x − 2, so 8 = 2x, and x = 4." },
      { prompt: "What is the value of 7² − 3²?", options: ["28", "34", "40", "46"], correct: 2,
        explain: "7² − 3² = 49 − 9 = 40." },
      { prompt: "A bag has 5 red and 7 blue marbles. What fraction of the marbles are red?", options: ["5/12", "7/12", "5/7", "1/2"], correct: 0,
        explain: "There are 12 marbles total, 5 of them red, so the fraction is 5/12." },
      { prompt: "If y = 3x + 1 and x = 4, what is y?", options: ["10", "12", "13", "14"], correct: 2,
        explain: "y = 3(4) + 1 = 12 + 1 = 13." },
      { prompt: "What is the least common multiple of 4 and 6?", options: ["10", "12", "18", "24"], correct: 1,
        explain: "Multiples of 4: 4, 8, 12… Multiples of 6: 6, 12… The smallest shared multiple is 12." },
      { prompt: "A triangle has angles of 40° and 65°. What is the third angle?", options: ["65°", "70°", "75°", "80°"], correct: 2,
        explain: "A triangle's angles sum to 180°, so the third angle is 180 − 40 − 65 = 75°." },
      { prompt: "Simplify: (2x)(3x²)", options: ["5x³", "6x²", "6x³", "6x"], correct: 2,
        explain: "Multiply coefficients (2×3=6) and add exponents (1+2=3): 6x³." },
      { prompt: "What is 7/8 as a decimal, rounded to the nearest hundredth?", options: ["0.78", "0.85", "0.88", "0.90"], correct: 2,
        explain: "7 ÷ 8 = 0.875, which rounds to 0.88." },
      { prompt: "A car travels 180 miles in 3 hours. What is its average speed?", options: ["45 mph", "55 mph", "60 mph", "65 mph"], correct: 2,
        explain: "Speed = distance ÷ time = 180 ÷ 3 = 60 mph." },
      { prompt: "What is the median of: 4, 9, 2, 11, 7?", options: ["4", "7", "9", "11"], correct: 1,
        explain: "Sorted, the values are 2, 4, 7, 9, 11 — the middle value is 7." },
      { prompt: "Solve for x: x/3 + 5 = 9", options: ["4", "9", "12", "27"], correct: 2,
        explain: "Subtract 5: x/3 = 4. Multiply by 3: x = 12." },
      { prompt: "A square has an area of 49. What is its perimeter?", options: ["14", "21", "28", "49"], correct: 2,
        explain: "The side length is √49 = 7, so the perimeter is 4 × 7 = 28." },
      { prompt: "What is 20% of 85?", options: ["15", "17", "20", "25"], correct: 1,
        explain: "20% of 85 = 0.2 × 85 = 17." },
      { prompt: "If 2^x = 32, what is x?", options: ["4", "5", "6", "16"], correct: 1,
        explain: "2⁵ = 32, so x = 5." },
      { prompt: "Simplify: 5x − (2x − 7)", options: ["3x − 7", "3x + 7", "7x − 7", "7x + 7"], correct: 1,
        explain: "Distribute the negative: 5x − 2x + 7 = 3x + 7." },
      { prompt: "Two numbers have a sum of 24 and a difference of 6. What is the larger number?", options: ["12", "15", "18", "21"], correct: 1,
        explain: "15 + 9 = 24 and 15 − 9 = 6, so the larger number is 15." },
      { prompt: "What is the volume of a cube with side length 3?", options: ["9", "18", "27", "81"], correct: 2,
        explain: "Volume = side³ = 3³ = 27." },
      { prompt: "If f(x) = x² + 2x, what is f(−3)?", options: ["−3", "3", "9", "15"], correct: 1,
        explain: "f(−3) = (−3)² + 2(−3) = 9 − 6 = 3." },
      { prompt: "Convert 3/4 to a percent.", options: ["34%", "65%", "75%", "80%"], correct: 2,
        explain: "3/4 = 0.75 = 75%." },
      { prompt: "A rectangle's length is twice its width. If the width is 6, what is the area?", options: ["36", "48", "72", "96"], correct: 2,
        explain: "Length = 12, so area = 12 × 6 = 72." },
      { prompt: "Solve for x: 4x + 9 = x + 21", options: ["3", "4", "5", "12"], correct: 1,
        explain: "Subtract x and 9: 3x = 12, so x = 4." },
      { prompt: "What is the greatest common factor of 18 and 24?", options: ["2", "3", "6", "9"], correct: 2,
        explain: "18 = 2×3² and 24 = 2³×3; the shared factors give a GCF of 6." },
      { prompt: "A $40 shirt is discounted 25%. What is the sale price?", options: ["$25", "$30", "$32", "$35"], correct: 1,

      { prompt: "What is the sum of the interior angles of a hexagon?", options: ["540°", "630°", "720°", "900°"], correct: 2,
        explain: "Interior angle sum = (n − 2) × 180° = (6 − 2) × 180° = 720°." }
    ],
    English: [
      { prompt: "Which sentence is correctly worded?", options: [
          "Neither of the students were ready for the exam.", "Neither of the students was ready for the exam.",
          "Neither of the students are ready for the exam.", "Neither of the student's was ready for the exam." ], correct: 1,
        explain: "“Neither” is singular, so it takes the singular verb “was,” regardless of the plural noun that follows “of.”" },
      { prompt: "Which sentence uses apostrophes correctly?", options: [
          "Its important to proofread you're work before submitting it.", "It's important to proofread your work before submitting it.",
          "It's important to proofread you're work before submitting it.", "Its important to proofread your work before submitting it." ], correct: 1,
        explain: "“It's” is the contraction of “it is,” and “your” is the possessive needed before “work.”" },
      { prompt: "Which sentence has correct subject-verb agreement?", options: [
          "The list of items are on the desk.", "The list of items is on the desk.",
          "The list of items were on the desk.", "The list of items be on the desk." ], correct: 1,
        explain: "The subject is “list” (singular); “of items” is a prepositional phrase that doesn’t change the verb." },
      { prompt: "Which version punctuates the introductory phrase correctly?", options: [
          "After the meeting Sarah, left early.", "After the meeting, Sarah left early.",
          "After, the meeting Sarah left early.", "After the meeting Sarah left, early." ], correct: 1,
        explain: "A comma follows an introductory phrase, setting it off from the main clause that begins with the subject." },
      { prompt: "Choose the best word: “The committee could not decide ___ proposal to approve.”", options: ["who's", "whose", "who", "whom"], correct: 1,
        explain: "“Whose” shows possession (“whose proposal”), unlike “who's,” which means “who is.”" },
      { prompt: "Which sentence avoids a dangling modifier?", options: [
          "Walking to school, the rain started to fall.", "Walking to school, I got caught in the rain.",
          "The rain started to fall, walking to school.", "Walking to school started the rain falling." ], correct: 1,
        explain: "The modifier “walking to school” must describe the subject right after it — “I,” not “the rain.”" },
      { prompt: "Which shows the correct plural possessive?", options: [
          "The childrens' toys were scattered everywhere.", "The children's toys were scattered everywhere.",
          "The childrens toy's were scattered everywhere.", "The children toys' were scattered everywhere." ], correct: 1,
        explain: "“Children” is already plural, so its possessive simply adds ’s: “children's.”" },
      { prompt: "Choose the correct word: “The effect of the new policy ___ immediate.”", options: ["were", "was", "are", "be"], correct: 1,
        explain: "The subject “effect” is singular, so it takes the singular verb “was.”" },
      { prompt: "Choose the correct word: “Between you and ___, I think the plan will work.”", options: ["I", "me", "myself", "mine"], correct: 1,
        explain: "“Me” is the object of the preposition “between,” so it takes the objective case." },
      { prompt: "Which sentence punctuates a series correctly?", options: [

        explain: "A comma separates each item in a series, including before “and” (the Oxford comma)." },
      { prompt: "Choose the correct verb form: “By next year, she ___ her degree.”", options: ["will complete", "will have completed", "completes", "completed"], correct: 1,

      { prompt: "Which uses “fewer/less” correctly?", options: [

        explain: "“Fewer” is for countable nouns like “books”; “less” is for uncountable amounts." },
      { prompt: "Choose the correctly formed comparative: “This year's harvest was ___ than last year's.”", options: ["more good", "gooder", "better", "best"], correct: 2,

    Reading: [
      { passage: "After three failed harvests, the town’s grain reserves dwindled to almost nothing. When the merchant Elsbeth arrived with a wagon of wheat from the valley, she found she could set almost any price she wished — and did.",

      { passage: "Every winter, the river froze thick enough to walk on, and every winter the town elders warned the children to stay off the ice — warnings the children treated as a dare.",

      { passage: "The museum’s newest exhibit displayed the explorer’s journals beside the equipment he’d carried — a compass with a cracked face, a coat worn thin at the elbows.",

        explain: "The wear described — cracked, worn thin — points to extensive use over a difficult journey." },
      { passage: "Every email from the new manager ended with the same line: ‘Let me know if anything is unclear.’ After a month, no one had ever taken her up on it.",
        prompt: "This detail most strongly suggests that the employees:", options: [

          "did not read her emails.", "preferred to email each other instead." ], correct: 1,

      { passage: "The chess club had met every Thursday for a decade, but when the new coach proposed moving practice to Mondays, three of the oldest members quit within the week.",

        explain: "Quitting over a schedule change, not the game itself, suggests the tradition mattered more than chess." },

        prompt: "This passage suggests that the bakery's business depends significantly on:", options: [

        explain: "Half the shelves are already gone to hotel deliveries before the first walk-in customer arrives." },

      { passage: "Every runner in the race had trained for months, but only Priya checked the weather forecast the night before and packed a second pair of shoes.",

        prompt: "Based on the table, the trend in temperature anomaly over time is:", options: ["decreasing.", "roughly constant.", "increasing.", "cyclical with no trend."], correct: 2,
        explain: "The anomaly rises at every interval shown, from 0.2°C to 0.8°C." },
      { table: { headers: ["Ice mass (g)", "5", "10", "15", "20", "25"], row: ["Melt time (min)", "4", "7", "11", "14", "18"] },
        prompt: "Based on the data, as the mass of the ice cube increases, melting time:", options: ["decreases.", "increases.", "stays constant.", "is unrelated to mass."], correct: 1,
        explain: "Melt time rises steadily alongside mass, from 4 to 18 minutes." },
      { table: { headers: ["Hours after meal", "1", "2", "3", "4", "5"], row: ["Glucose (mg/dL)", "160", "135", "115", "100", "90"] },
        prompt: "Based on the table, blood glucose after the meal is:", options: ["rising throughout.", "falling, with the rate of decline slowing over time.", "constant.", "falling at a constant rate."], correct: 1,
        explain: "The drops are 25, 20, 15, then 10 — glucose keeps falling, but increasingly slowly." },
      { table: { headers: ["Hours studied", "0", "2", "4", "6", "8"], row: ["Test score (%)", "50", "60", "72", "80", "82"] },
        prompt: "Based on the table, the relationship between study hours and test score is best described as:", options: ["no relationship.", "a steady increase that levels off at higher study hours.", "a steady decrease.", "random fluctuation."], correct: 1,
        explain: "Score gains shrink from 10 to 12 to 8 to 2 points — rising overall but leveling off." },
      { table: { headers: ["Planet", "Mercury", "Venus", "Earth", "Mars", "Jupiter"], row: ["Moons", "0", "0", "1", "2", "95"] },
        prompt: "Based on the table, which statement is best supported?", options: [
          "All planets have at least one moon.", "The number of moons generally increases with distance from the sun among these planets.",
          "Venus has the most moons.", "Earth has more moons than Mars." ], correct: 1,
        explain: "Moon counts broadly rise moving outward from the sun (0, 0, 1, 2, 95), even though Earth and Mars alone don't strictly increase." },
      { table: { headers: ["Trial (year)", "1", "2", "3", "4", "5"], row: ["Rainwater pH", "5.6", "5.1", "4.8", "4.5", "4.2"] },
        prompt: "Based on the table, over the five years sampled, the rainwater has become:", options: ["more acidic.", "more basic.", "neutral.", "unchanged."], correct: 0,
        explain: "pH falls steadily from 5.6 to 4.2, meaning the rainwater has become more acidic." },
      { table: { headers: ["Exercise (min)", "0", "15", "30", "45", "60"], row: ["Heart rate (bpm)", "70", "110", "130", "140", "142"] },
        prompt: "Based on the table, as exercise duration increases, heart rate increases:", options: ["at a constant rate throughout.", "quickly at first, then levels off.", "slowly at first, then rises quickly.", "not at all."], correct: 1,
        explain: "The gains are 40, 20, 10, then 2 bpm — a fast rise early that levels off later." },
      { table: { headers: ["Sample pH", "3", "5", "7", "9", "11"], row: ["Absorbance", "0.9", "0.6", "0.3", "0.6", "0.9"] },
        prompt: "Based on the table, absorbance is lowest at approximately pH:", options: ["3", "5", "7", "9"], correct: 2,
        explain: "Absorbance dips to its minimum, 0.3, at pH 7, then rises again on either side." },
      { table: { headers: ["Time (s)", "1", "2", "3", "4", "5"], row: ["Distance (m)", "2", "8", "18", "32", "50"] },
        prompt: "Based on the table, as time increases, the distance traveled:", options: ["increases at a constant rate.", "increases at an increasing rate.", "increases at a decreasing rate.", "stays constant."], correct: 1,
        explain: "The gains between each second (6, 10, 14, 18 m) keep growing, showing an increasing rate." },
      { table: { headers: ["Tree age (yrs)", "5", "10", "15", "20", "25"], row: ["Trunk diameter (cm)", "8", "15", "23", "30", "38"] },
        prompt: "Based on the table, tree age and trunk diameter show what kind of relationship?", options: ["direct — diameter increases as age increases.", "inverse.", "no relationship.", "diameter decreases as age increases."], correct: 0,
        explain: "Diameter rises steadily alongside age, from 8 cm to 38 cm." },
      { table: { headers: ["Hrs after sunset", "0", "1", "2", "3", "4"], row: ["Temp (°F)", "75", "68", "62", "58", "56"] },
        prompt: "Based on the table, as time after sunset increases, temperature drops:", options: ["at a constant rate.", "quickly at first, then more slowly.", "slowly at first, then quickly.", "not at all."], correct: 1,
        explain: "The drops are 7°, 6°, 4°, then 2° — a quick early fall that slows over time." }
    ]
  };
  var LETTERS = ["A", "B", "C", "D"];

  function todayKey() {
    var d = new Date();
    var m = ("0" + (d.getMonth() + 1)).slice(-2);
    var day = ("0" + d.getDate()).slice(-2);
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function puzzleNumber(dateStr) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var epoch = new Date(2026, 0, 1);
    return Math.floor((d - epoch) / 86400000) + 1;
  }
  function buildDaily(dateStr) {
    // each pool holds one slot per day of the month, so every day gets a
    // different question in every section, with no repeats within a month
    var day = parseInt(dateStr.split("-")[2], 10);
    return SECTIONS.map(function (sec) {
      var pool = POOLS[sec];
      var idx = (day - 1) % pool.length;
      var q = pool[idx];
      return Object.assign({ section: sec }, q);
    });
  }

  var currentDayKey = todayKey();
  var QUESTIONS = buildDaily(currentDayKey);

  var card = document.getElementById("card");

  var state = {
    started: false,
    index: 0,
    picked: [],      // index picked per question; -1 means timed out unanswered
    finished: false
  };

  // timer bookkeeping lives outside the persisted/snapshot state
  var timerId = null;
  var timerForIndex = -1;
  var secondsLeft = TIME_LIMIT;

  function prettyDate(dateStr) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function refreshMeta() {
    var meta = document.getElementById("puzzle-meta");
    if (!meta) return;
    meta.innerHTML = "Puzzle #" + puzzleNumber(currentDayKey) + " · " + prettyDate(currentDayKey) + "<br>60 seconds each";
  }
  refreshMeta();

  // check once a minute whether local midnight has passed; if so, load a fresh puzzle
  setInterval(function () {
    var k = todayKey();
    if (k === currentDayKey) return;
    currentDayKey = k;
    QUESTIONS = buildDaily(currentDayKey);
    clearTimer();
    state.started = false;
    state.index = 0;
    state.picked = [];
    state.finished = false;
    refreshMeta();
    render();
  }, 30000);

  function clearTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    timerForIndex = -1;
  }

  function bestScore() {
    try { return JSON.parse(localStorage.getItem("actle-best") || "null"); }
    catch (e) { return null; }
  }
  function saveBest(score) {
    try {
      var best = bestScore();
      if (best === null || score > best) localStorage.setItem("actle-best", JSON.stringify(score));
    } catch (e) {}
  }

  function submittedKey(date) { return "actle-submitted-" + date; }
  function maybeSubmitScore(date, score) {
    try {
      if (localStorage.getItem(submittedKey(date))) return;
    } catch (e) {}
    fetch("/api/submit-score", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: date, score: score })
    }).then(function (r) {
      // only remember success, so a failed attempt can retry on the next play today
      if (r.ok) { try { localStorage.setItem(submittedKey(date), "1"); } catch (e) {} }
    }).catch(function () {});
  }
  function renderCompare(mount, counts, myScore) {
    var total = counts.reduce(function (a, b) { return a + b; }, 0);
    if (total < 1) {
      mount.innerHTML = '<div class="compare-note">You’re the first to finish today’s ACTLE — check back later to see how others do.</div>';
      return;
    }
    var below = 0;
    for (var s = 0; s < myScore; s++) below += counts[s];
    var pct = Math.round((below / total) * 100);
    var max = Math.max.apply(null, counts.concat([1]));
    var barsHtml = counts.map(function (c, s) {
      var h = Math.max(Math.round((c / max) * 100), c > 0 ? 6 : 2);
      var mine = s === myScore;
      return '<div class="bar-col' + (mine ? " mine" : "") + '">' +
        '<span class="bar-count">' + c + '</span>' +
        '<div class="bar-track"><div class="bar-fill' + (mine ? " mine" : "") + '" style="height:' + h + '%"></div></div>' +
        '<span class="bar-label">' + s + '/4</span>' +
        '</div>';
    }).join("");
    mount.innerHTML =
      '<div class="percentile-line">Better than <b>' + pct + '%</b> of today’s players.</div>' +
      '<div class="compare-sub">' + total + ' ' + (total === 1 ? "player has" : "players have") + ' finished today’s ACTLE.</div>' +
      '<div class="bars">' + barsHtml + '</div>';
  }
  function loadStats(date, mount) {
    fetch("/api/stats?date=" + encodeURIComponent(date))
      .then(function (r) { if (!r.ok) throw new Error("bad response"); return r.json(); })
      .then(function (data) { renderCompare(mount, data.counts || [0,0,0,0,0], loadStats._myScore); })
      .catch(function () {
        mount.innerHTML = '<div class="compare-note">Today’s comparison isn’t available right now.</div>';
      });
  }

  function resultKey(date) { return "actle-result-" + date; }
  function loadCompletedToday(date) {
    try {
      var raw = localStorage.getItem(resultKey(date));
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.picked)) return parsed;
    } catch (e) {}
    return null;
  }
  function saveCompletedToday(date, picked, score) {
    try { localStorage.setItem(resultKey(date), JSON.stringify({ picked: picked, score: score })); } catch (e) {}
  }

  function render() {
    // one attempt per day: if today's puzzle was already finished (even in an
    // earlier visit or before a reload), jump straight to the locked result
    if (!state.finished) {
      var completed = loadCompletedToday(currentDayKey);
      if (completed) {
        state.started = true;
        state.picked = completed.picked.slice();
        state.finished = true;
      }
    }
    if (!state.started) return renderStart();
    if (state.finished) return renderResults();
    return renderQuestion();
  }

  function renderStart() {
    clearTimer();
    var best = bestScore();
    var bestLine = best === null ? "" :
      '<div class="stat-chip">Best so far · ' + best + '/4</div>';
    card.innerHTML =
      '<div class="start-copy">One question from each ACT section — Math, English, Reading, Science. You get 60 seconds on the clock per question, then the answer locks in and you see how you did.</div>' +
      '<div class="sections-preview">' +
        '<span class="tag">Math</span><span class="tag">English</span><span class="tag">Reading</span><span class="tag">Science</span>' +
      '</div>' +
      '<div class="start-stats"><div class="stat-chip">4 questions</div><div class="stat-chip">60s each</div>' + bestLine + '</div>' +
      '<button class="primary" id="go">Start the clock</button>';
    document.getElementById("go").addEventListener("click", function () {
      state.started = true;
      render();
    });
  }

  function paintTimer() {
    var fill = document.getElementById("timer-fill");
    var num = document.getElementById("timer-num");
    if (!fill || !num) return;
    var pct = Math.max(0, (secondsLeft / TIME_LIMIT) * 100);
    fill.style.width = pct + "%";
    num.textContent = secondsLeft + "s";
    var danger = secondsLeft <= 10;
    fill.classList.toggle("danger", danger);
    num.classList.toggle("danger", danger);
  }

  function startTimerIfNeeded(i) {
    if (timerForIndex === i) { paintTimer(); return; }
    clearTimer();
    timerForIndex = i;
    secondsLeft = TIME_LIMIT;
    paintTimer();
    timerId = setInterval(function () {
      secondsLeft--;
      if (secondsLeft <= 0) {
        clearTimer();
        state.picked[i] = -1;
        render();
        return;
      }
      paintTimer();
    }, 1000);
  }

  function renderQuestion() {
    var i = state.index;
    var q = QUESTIONS[i];
    var picked = state.picked[i];
    var answered = picked !== undefined;

    var dots = "";
    for (var d = 0; d < QUESTIONS.length; d++) {
      var cls = "dot";
      if (d === i && !answered) cls += " current";
      else if (state.picked[d] !== undefined) {
        cls += state.picked[d] === QUESTIONS[d].correct ? " correct" : " incorrect";
      }
      dots += '<span class="' + cls + '"></span>';
    }

    var passageHtml = q.passage ? '<div class="q-passage">' + q.passage + '</div>' : "";
    var tableHtml = "";
    if (q.table) {
      tableHtml = '<div class="q-table-wrap"><table class="q-table"><thead><tr>' +
        q.table.headers.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
        '</tr></thead><tbody><tr>' +
        q.table.row.map(function (c) { return "<td>" + c + "</td>"; }).join("") +
        '</tr></tbody></table></div>';
    }

    var optionsHtml = q.options.map(function (opt, oi) {
      var cls = "bubble";
      var dis = "";
      if (answered) {
        dis = "disabled";
        if (oi === q.correct) cls += " show-correct";
        else if (oi === picked) cls += " show-incorrect";
        if (oi === picked && picked > -1) cls += " picked";
      }
      return '<button class="' + cls + '" data-i="' + oi + '" ' + dis + '>' +
        '<span class="letter">' + LETTERS[oi] + '</span><span>' + opt + '</span></button>';
    }).join("");

    var verdictHtml = "";
    if (answered) {
      var timedOut = picked === -1;
      var isRight = !timedOut && picked === q.correct;
      var label = timedOut ? "Time’s up" : (isRight ? "Correct" : "Not quite");
      verdictHtml =
        '<div class="verdict ' + (isRight ? "correct" : "incorrect") + '">' + label + '</div>' +
        '<div class="explain">' + q.explain + '</div>' +
        '<div class="btn-row"><button class="primary" id="next">' +
        (i === QUESTIONS.length - 1 ? "See results" : "Next question") + '</button></div>';
    }

    card.innerHTML =
      '<div class="progress-row">' + dots + '<span class="progress-count">' + (i + 1) + ' / ' + QUESTIONS.length + '</span></div>' +
      (answered ? "" : '<div class="timer-row"><div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div><span class="timer-num" id="timer-num">' + secondsLeft + 's</span></div>') +
      '<div class="q-tag"><span class="tag">' + q.section + '</span></div>' +
      '<div class="q-prompt">' + q.prompt + '</div>' +
      passageHtml + tableHtml +
      '<div class="options">' + optionsHtml + '</div>' +
      verdictHtml;

    if (!answered) {
      startTimerIfNeeded(i);
      Array.prototype.forEach.call(card.querySelectorAll(".bubble"), function (b) {
        b.addEventListener("click", function () {
          clearTimer();
          state.picked[i] = parseInt(b.getAttribute("data-i"), 10);
          render();
        });
      });
    } else {
      clearTimer();
      document.getElementById("next").addEventListener("click", function () {
        if (i === QUESTIONS.length - 1) {
          state.finished = true;
        } else {
          state.index++;
        }
        render();
      });
    }
  }

  function renderResults() {
    clearTimer();
    var score = 0;
    var rows = QUESTIONS.map(function (q, i) {
      var right = state.picked[i] === q.correct;
      if (right) score++;
      return { q: q, right: right, timedOut: state.picked[i] === -1 };
    });
    saveBest(score);
    saveCompletedToday(currentDayKey, state.picked, score);

    var verdictText = [
      "Worth another lap — review the explanations and try again.",
      "A rough start, but the pattern's there.",
      "Right down the middle — solid, with room to sharpen.",
      "Clean sweep — all four, no mistakes."
    ][score];

    var breakdownHtml = rows.map(function (r) {
      var markText = r.right ? "Correct" : (r.timedOut ? "Timed out" : "Missed");
      return '<div class="b-row"><span class="tag b-tag">' + r.q.section + '</span>' +
        '<span class="b-q">' + r.q.prompt + '</span>' +
        '<span class="b-mark ' + (r.right ? "correct" : "incorrect") + '">' + markText + '</span></div>';
    }).join("");

    card.innerHTML =
      '<div class="score-hero"><span class="score-big">' + score + '/4</span><span class="score-label">Final score</span></div>' +
      '<div class="score-verdict">' + verdictText + '</div>' +
      '<div class="breakdown">' + breakdownHtml + '</div>' +
      '<div class="compare">' +
        '<div class="compare-title">Today’s players</div>' +
        '<div id="compare-mount"><div class="compare-note">Loading today’s comparison…</div></div>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="primary" id="share">Share score</button>' +
        '<span class="copy-note" id="copy-note" hidden>Copied — paste it anywhere.</span>' +
      '</div>' +
      '<div class="lock-note">That’s today’s ACTLE — come back after midnight for a new puzzle.</div>';

    maybeSubmitScore(currentDayKey, score);
    loadStats._myScore = score;
    loadStats(currentDayKey, document.getElementById("compare-mount"));

    document.getElementById("share").addEventListener("click", function () {
      var grid = rows.map(function (r) {
        return SECTION_EMOJI[r.q.section] + (r.right ? "✅" : "❌");
      }).join(" ");
      var shareUrl = "https://actle.org";
      var text = "I scored " + score + "/4 on ACTLE today!\n" + grid;
      var note = document.getElementById("copy-note");
      function showNote() { note.hidden = false; setTimeout(function () { note.hidden = true; }, 1800); }

      if (navigator.share) {
        // iOS Messages drops the "text" field and shows only a link card when
        // "url" is set separately, so fold the link into the text itself instead.
        navigator.share({ title: "ACTLE", text: text + "\n" + shareUrl }).catch(function () {
          // user canceled the share sheet, or the browser refused it — either way, no error to show
        });
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text + "\n" + shareUrl).then(showNote, showNote);
      } else {
        showNote();
      }
    });
  }

  function boot(data) {
    if (data && typeof data === "object") {
      state = Object.assign(state, data);
    }
    render();
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(function () { return state; });
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
  } else {
    boot({});
  }
})();
</script>

</body>
</html>
